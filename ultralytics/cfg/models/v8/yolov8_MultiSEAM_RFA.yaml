
# Ultralytics YOLO 🚀, GPL-3.0 license
# YOLOv8 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 1  # number of classes
depth_multiple: 0.33  # scales module repeats
width_multiple: 0.25  # scales convolution channels
max_channels: 1024

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, GSVAdaptiveConv, [128, 3, 2]]  # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, GSVAdaptiveConv, [256, 3, 2]]  # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, GSVAdaptiveConv, [512, 3, 2]]  # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, GSVAdaptiveConv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 3, C2f_AggregatedAtt, [1024, 20, 1, True]]
  - [-1, 1, SPPF, [1024, 5]]  # 9

# YOLOv8.0n head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]  # cat backbone P4
  - [-1, 3, C2f, [512]]  # 12

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]  # cat backbone P3
  - [-1, 3, C2f, [256]]  # 15 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 2], 1, Concat, [1]]  #
  - [-1, 3, C2f, [128]]  #  18

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]  # cat head P4
  - [-1, 3, C2f, [256]]  # 21 (P4/16-medium)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]  # cat head P5
  - [-1, 3, C2f, [512]]  # 24 (P5/32-large)

  - [18, 1, MultiSEAM, [128, 1, 3, [6, 7, 8], 16]]
  - [-1, 1, Conv, [256, 1, 1]]  # 26
  - [21, 1, MultiSEAM, [256, 1, 3, [6, 7, 8], 16]]
  - [-1, 1, Conv, [512, 1, 1]]  # 28
  - [24, 1, MultiSEAM, [512, 1, 3, [6, 7, 8], 16]]
  - [-1, 1, Conv, [1024, 1, 1]]  # 30

  - [[26, 28, 30], 1, Detect, [nc]]  # Detect(P3, P4, P5)